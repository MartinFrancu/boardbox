<title>One Punch Playtest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Archivo+Black&display=swap">
<style>
/* Layout: one phone column. Sticky status bar, monster grid on top, actions below. */
:root {
  --paper: #f2f3ef; --surface: #ffffff; --ink: #16181d; --muted: #5c6270; --line: #d8dad3;
  --cape: #e3b21b; --cape-ink: #2a2100; --threat: #c4372b; --civ: #2c6d8c; --ok: #2d8550;
  --hit: rgba(227, 178, 27, .55); --miss: rgba(227, 178, 27, .22);
  --display: "Archivo Black", "Arial Black", Impact, sans-serif;
  --body: "Archivo", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #111216; --surface: #1b1d23; --ink: #ecebe6; --muted: #9ca2ad; --line: #2d3039;
  --cape: #f0c445; --cape-ink: #221a00; --threat: #ee5c4d; --civ: #62aacb; --ok: #4fb879;
  --hit: rgba(240, 196, 69, .6); --miss: rgba(240, 196, 69, .2); color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #111216; --surface: #1b1d23; --ink: #ecebe6; --muted: #9ca2ad; --line: #2d3039;
  --cape: #f0c445; --cape-ink: #221a00; --threat: #ee5c4d; --civ: #62aacb; --ok: #4fb879;
  --hit: rgba(240, 196, 69, .6); --miss: rgba(240, 196, 69, .2); color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--paper); color: var(--ink); font: 15px/1.4 var(--body); margin: 0 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 48px; display: grid; gap: 14px }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: .01em }
h1 { font-size: 26px; line-height: 1.05 }
h2 { font-size: 20px }
h3 { font-size: 15px }
button { font: 600 14px var(--body); color: var(--ink); background: var(--surface); border: 1.5px solid var(--ink); border-radius: 6px; padding: 9px 12px; cursor: pointer; min-height: 40px }
button:focus-visible { outline: 3px solid var(--cape); outline-offset: 2px }
button:disabled { opacity: .35; cursor: default }
button.primary { background: var(--ink); color: var(--paper) }
button.cape { background: var(--cape); color: var(--cape-ink); border-color: var(--cape) }
button.ghost { border-color: var(--line) }
button.on { background: var(--ink); color: var(--paper) }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700 }
.muted { color: var(--muted) }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.between { justify-content: space-between }

/* status bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1.5px solid var(--ink) }
.bar .inner { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px; display: grid; gap: 6px }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px }
.stat { display: grid; gap: 0 }
.stat b { font: 400 20px var(--display); font-variant-numeric: tabular-nums }
.stat.civ b { color: var(--civ) }
.stat.danger b { color: var(--threat) }
.saitama-on { background: var(--cape); color: var(--cape-ink); border-radius: 4px; padding: 0 6px; font-weight: 700 }

.turn { font: 400 18px var(--display); padding: 10px 12px; border-radius: 6px; background: var(--ink); color: var(--paper) }
.turn small { display: block; font: 600 13px var(--body); opacity: .75 }

/* monster */
.panel { background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 10px; min-width: 0 }
.panel.focus { border-color: var(--ink) }
.chips { display: flex; gap: 6px; flex-wrap: wrap }
.chip { font-size: 12px; font-weight: 700; border: 1.5px solid var(--line); border-radius: 999px; padding: 2px 8px; font-variant-numeric: tabular-nums }
.chip.threat { border-color: var(--threat); color: var(--threat) }
.chip.term { background: var(--threat); color: #fff; border-color: var(--threat) }
.grid { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 3px; width: min(100%, calc(var(--cols) * 54px)); margin: 0 auto; touch-action: manipulation }
.cell { aspect-ratio: 1; border-radius: 3px; background: transparent; border: 1px dashed var(--line); position: relative; padding: 0; min-height: 0 }
.cell.hp { background: var(--ink); border: 1px solid var(--ink) }
.cell.x { background: transparent; border: 1px solid var(--line) }
.cell.x::after { content: "\2715"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--threat); font: 700 clamp(14px, 5vw, 24px) var(--body) }
.cell.pv { box-shadow: inset 0 0 0 3px var(--cape); background-color: var(--miss) }
.cell.hp.pv { background: var(--cape) }
.cell.pickable { outline: 2px solid var(--cape); outline-offset: -2px; cursor: pointer }
.extra { font-size: 13px; border-left: 3px solid var(--threat); padding-left: 8px }

/* stencil mini */
.mini { display: inline-grid; gap: 1px; vertical-align: middle }
.mini i { width: 7px; height: 7px; border-radius: 1px; background: var(--line) }
.mini i.h { background: var(--ink) }
.moves { display: flex; gap: 6px; flex-wrap: wrap }
.moves button { display: flex; gap: 8px; align-items: center; padding: 6px 10px }
.moves button.on .mini i.h { background: var(--paper) }
.moves button.on .mini i { background: rgba(127,127,127,.4) }

/* heroes */
.heroes { display: grid; gap: 8px }
.hero { border: 1.5px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 6px; background: var(--surface) }
.hero.done { opacity: .55 }
.hero .name { font: 400 16px var(--display) }
.cls { font: 400 13px var(--display); border-radius: 4px; padding: 1px 6px; background: var(--ink); color: var(--paper) }
.cls.S { background: var(--cape); color: var(--cape-ink) }
.hero p { margin: 0; font-size: 13px }
.hero p b { font-weight: 700 }

/* ladder & log */
details { background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 12px }
summary { cursor: pointer; font: 400 15px var(--display) }
ol.ladder { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 2px; font-variant-numeric: tabular-nums }
ol.ladder li { display: grid; grid-template-columns: 26px 28px 1fr auto; gap: 8px; align-items: center; padding: 3px 4px; border-radius: 4px }
ol.ladder li.sai { background: var(--cape); color: var(--cape-ink) }
ol.ladder li .n { color: var(--muted); text-align: right }
ol.ladder li.sai .n { color: inherit }
ol.ladder li button { min-height: 34px; padding: 4px 12px }
.tag { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em }
ul.log { margin: 8px 0 0; padding-left: 18px; font-size: 13px; display: grid; gap: 2px }
ul.log li.sep { list-style: none; margin-left: -18px; font-weight: 700; margin-top: 6px }

.start { display: grid; gap: 16px; padding-top: 20px }
.seg { display: flex; gap: 6px }
.seg button { flex: 1; font: 400 18px var(--display) }
.big { font-size: 16px; padding: 12px; min-height: 48px }
.over h1 { font-size: 34px }
@media (prefers-reduced-motion: no-preference) { .cell { transition: background .12s } }
</style>

<div id="app"></div>

ne-two", "B": "hammer", "A": "double-fist", "S": "wall"}, "attack": "one move of current class or lower. If he attacked this same monster in an earlier round, also cross out 1 more health cell anywhere.", "support": "none.", "fx": {"repeatBonus": 1}}, {"id": "fubuki", "name": "Fubuki", "cost": 2, "moves": {"C": "one-two", "B": "block", "A": "gate", "S": "crush"}, "attack": "one move of current class or lower.", "support": "+1 money.", "fx": {"money": 1}}, {"id": "drive-knight", "name": "Drive Knight", "cost": 2, "moves": {"C": "hook", "B": "zigzag", "A": "cascade", "S": "long-cascade"}, "attack": "one move of current class or lower. May mirror it.", "support": "none.", "fx": {"mirror": true}}, {"id": "tank-top-master", "name": "Tank-Top Master", "cost": 2, "moves": {"C": "one-two", "B": "hammer", "A": "tank-press", "S": "avalanche"}, "attack": "one move of current class or lower.", "support": "this round's toll -1.", "fx": {"tollMinus": 1}}, {"id": "king", "name": "King", "cost": 2, "moves": null, "attack": "crosses nothing. Instead, Saitama appears right now: take him out of the hero deck (or discard pile).", "support": "none.", "fx": {"summonSaitama": true}}, {"id": "genos", "name": "Genos", "cost": 3, "moves": {"C": "combo", "B": "barrage", "A": "beam", "S": "mega-beam"}, "attack": "one move of current class or lower.", "support": "cross out 1 health cell anywhere.", "fx": {"crossCells": 1}}, {"id": "child-emperor", "name": "Child Emperor", "cost": 3, "moves": {"C": "twin-strike", "B": "four-corners", "A": "gadget-spread", "S": "missile-rain"}, "attack": "one move of current class or lower.", "support": "look at the top 3 hero cards and put them back in any order (can delay Saitama).", "fx": {"peekHeroes": 3}}, {"id": "flashy-flash", "name": "Flashy Flash", "cost": 3, "moves": {"C": "jab", "B": "twin-strike", "A": "flicker", "S": "lightning-step"}, "attack": "one move of current class or lower. Attacking with Flash doesn't end your turn; take another action.", "s ###..", "######"]}, {"id": "vaccine-man", "name": "Vaccine Man", "level": "Tiger", "toll": 2, "fame": 2, "terminal": false, "extra": "", "fx": {}, "grid": ["..##..", ".####.", ".####.", "..#..."]}, {"id": "marugori", "name": "Marugori", "level": "Tiger", "toll": 2, "fame": 2, "terminal": false, "extra": "", "fx": {}, "grid": [".####.", "######"]}, {"id": "beast-king", "name": "Beast King", "level": "Tiger", "toll": 2, "fame": 2, "terminal": false, "extra": "", "fx": {}, "grid": ["#.##.#", ".####.", "..#..."]}, {"id": "carnage-kabuto", "name": "Carnage Kabuto", "level": "Demon", "toll": 3, "fame": 3, "terminal": false, "extra": "from his 3rd round alive, toll is doubled.", "fx": {"doubleTollFromRound": 3}, "grid": ["..##..", ".####.", "######", "#....#"]}, {"id": "ancient-king", "name": "Ancient King", "level": "Demon", "toll": 3, "fame": 3, "terminal": false, "extra": "", "fx": {}, "grid": ["######", "#....#", "######"]}, {"id": "melzargard", "name": "Melzargard", "level": "Demon", "toll": 3, "fame": 3, "terminal": false, "extra": "at the end of each round, un-cross 2 health cells.", "fx": {"regen": 2}, "grid": ["#.#.#.", ".#.#.#", "#.#.#.", ".#.#.#"]}, {"id": "gouketsu", "name": "Gouketsu", "level": "Demon", "toll": 3, "fame": 3, "terminal": false, "extra": "", "fx": {}, "grid": [".####.", "##..##", "##..##", ".###.."]}, {"id": "deep-sea-king", "name": "Deep Sea King", "level": "Demon", "toll": 3, "fame": 4, "terminal": true, "extra": "toll +1 for each round he survives.", "fx": {"tollGrowth": 1}, "grid": ["..##..", ".####.", "######", ".####."]}, {"id": "elder-centipede", "name": "Elder Centipede", "level": "Dragon", "toll": 4, "fame": 5, "terminal": true, "extra": "armored; stencils with fewer than 4 holes do nothing.", "fx": {"armor": 4}, "grid": ["######", "#.....", "######", ".....#", "######"]}, {"id": "boros", "name": "Boros", "level": "Dragon", "toll": 5, "fame": 6, "terminal": true, "extra": "at the end of each round, un-cross 3 health cells.", "fx": {"reg // ---------- game flow
function newGame(players) {
  const normals = shuffle(D.monsters.filter(m => !m.terminal).map(m => m.id));

    case 'players': ui.players = +b.dataset.n; return render();
    case 'start': newGame(ui.players); save(); return render();
    case 'undo': return undo();
    case 'new': if (ui.confirmNew) { S = null; history = []; ui.confirmNew = false; try { localStorage.removeItem(KEY); } catch (e) {} } else ui.confirmNew = true; return render();
    case 'newConfirmed': S = null; history = []; try { localStorage.removeItem(KEY); } catch (e) {} return render();
    case 'pass': return act(pass);
    case 'hire': case 'use': {
      const hire = a === 'hire';
      if (HERO[id].fx.summonSaitama) return act(() => kingSummons(id, hire));
      const opts = usableMoves(id); const first = opts.findIndex(o => fits(o.id, HERO[id].fx.mirror));
      ui.attack = { heroId: id, hire, opts, sel: first >= 0 ? first : null, rot: 0, mir: false, anchor: null };
      return render();
    }
    case 'pickMove': ui.attack.sel = +b.dataset.i; ui.attack.rot = 0; ui.attack.mir = false; return render();
    case 'rot': ui.attack.rot = (ui.attack.rot + 1) % 4; return render();
    case 'mir': ui.attack.mir = !ui.attack.mir; return render();
    case 'cancel': ui.attack = null; return render();
    case 'strike': { const cells = previewCells(); const { heroId, hire } = ui.attack; ui.attack = null; return act(() => strike(heroId, hire, cells)); }
    case 'cell': {
      const r = +b.dataset.r, c = +b.dataset.c;
      if (S.phase === 'pick') {
        const m = MON[S.monster.id]; if (m.grid[r][c] !== '#' || S.monster.crossed.includes(k(r, c))) return;
        return act(() => { S.monster.crossed.push(k(r, c)); log(`${HERO[S.pick.by].name} crosses 1 extra cell.`); S.pick.n--; if (S.pick.n <= 0 || !healthLeft().length) afterPick(); });
      }
      if (ui.attack && ui.attack.sel != null) { ui.attack.anchor = [r, c]; return render(); }
      return;
    }
    case 'fame': return act(() => { moveUp(id, 1); S.fame.left--; log(`${HERO[id].name} gains 1 fame.`); });
    case 'fameDone': return act(finishInteraction);
    case 'peekUp': case 'peekDown': {
      const i = +b.dataset.i, j = a === 'peekUp' ? i - 1 : i + 1; const cs = S.peek.cards; [cs[i], cs[j]] = [cs[j], cs[i]]; return render();
    }
    case 'peekDone': return act(() => { const n = S.peek.cards.length; S.heroDeck.splice(0, n, ...S.peek.cards); log(`${HERO[S.peek.by].name} reorders the top ${n} hero cards.`); finishInteraction(); });
    case 'promote': return act(() => { moveUp(id, 1); S.sfUsed = true; log(`Silver Fang trains ${HERO[id].name} (+1 slot).`); finishInteraction(); });
    case 'promoteSkip': return act(() => { log('Silver Fang skips training.'); finishInteraction(); });
  }
});

// ---------- boot
function start(data) {
  if (data && data.S) { S = data.S; history = data.history || []; } else load();
  render();
}
window.claude?.hot?.snapshot?.(() => ({ S, history }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
